name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regression tests
        # The whole suite, the way it is run locally (python -m unittest discover -s tests),
        # not one module: until 24 Sep 2026 CI ran tests.test_regressions alone.
        run: python -m unittest discover -s tests
